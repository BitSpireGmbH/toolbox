name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
  push:
    tags: ['v*']

permissions:
  contents: write
  # Azure is authenticated through OIDC rather than a stored credential, and
  # azure/login mints that token from this permission. It is load-bearing for the
  # deploy - not leftover scaffolding.
  id-token: write

concurrency:
  # Never let two releases run at once.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Deploy
    runs-on: ubuntu-latest
    # Load-bearing, not decorative. Declaring an environment is what puts
    # "environment:production" in the OIDC subject claim, and the federated
    # credential on the user-assigned managed identity bitspire-toolkit-id-a644 is
    # pinned to exactly "repo:BitSpireGmbH/toolbox:environment:production". It also
    # makes that claim the same for both triggers: without an environment a tag
    # push would present "ref:refs/tags/v1.2.3", which no credential on that
    # identity matches. Renaming this needs a matching credential in Azure first.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed so the bump commit can be pushed back.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Required to build the browser-wasm project; not bundled with the SDK.
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Everything that can say no runs before the bump, so a failing build never
      # leaves a version bump sitting on main with nothing deployed for it.
      - name: Lint
        run: npm run lint

      - name: Test .NET
        run: npm run test:wasm -- -c Release

      - name: Test
        run: npm test

      - name: Bump the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # npm version writes package.json and package-lock.json, runs the "version"
          # lifecycle script (which regenerates and stages src/environments/app-version.ts),
          # commits the lot, and creates the matching v-tag.
          #
          # Its stdout carries that lifecycle script's output as well as the new
          # version, so read the result back out of package.json instead of
          # capturing what it printed.
          npm version "${{ inputs.bump }}" -m 'Release v%s' > /dev/null
          VERSION="$(node -p "require('./package.json').version")"
          echo "Bumped to v$VERSION"
          # --atomic so a bad tag ref cannot leave the bump commit on the branch
          # with no tag pointing at it.
          git push --atomic origin HEAD:"${GITHUB_REF_NAME}" "v$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # The tag is what the sidebar version and the deployed build are identified
      # by, so a tag that disagrees with package.json would mislabel the release.
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          WANTED="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$WANTED" ]; then
            echo "::error::package.json is $PKG but the tag says $WANTED. Use the Release workflow, or run 'npm version' and push the tag it creates."
            exit 1
          fi
          echo "RELEASE_VERSION=$PKG" >> "$GITHUB_ENV"

      # Built after the bump, so the app carries the version it is deployed under.
      - name: Build
        run: npm run build -- --configuration production

      # deploy.yml stays as the manual redeploy path for a commit that is already built.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C4BCCD6F32884502A82C471396DD32FB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7A7AC6E73134FAC8A99674E317A2EC9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DCC79192346349369199FC0B8E04D96B }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bitspire-toolkit'
          slot-name: 'Production'
          package: dist/toolbox/browser

      - name: Summarise the deploy
        run: |
          {
            echo "### Deployed \`v$RELEASE_VERSION\`"
            echo
            echo "<https://toolbox.bitspire.ch>"
          } >> "$GITHUB_STEP_SUMMARY"
