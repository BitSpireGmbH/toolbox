name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Required to build the browser-wasm project; not bundled with the SDK.
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Angular Build Cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-angular-

      - name: Install dependencies
        run: npm ci

      - name: Check the app version matches package.json
        run: node scripts/write-version.mjs --check

      - name: Lint
        run: npm run lint

      # The .NET regex semantics live here: fast, browser-free, and the only place
      # System.Text.RegularExpressions behaviour is actually asserted.
      - name: Test .NET
        run: npm run test:wasm -- -c Release

      # `npm run build` publishes the WebAssembly runtime first, then bundles it in
      # as a copied asset.
      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm run test --if-present

      # What "npm install -g dotnet-toolbox" would actually hand someone: the CLI
      # serving this build, and the tarball it would be served from.
      - name: Test CLI
        run: npm run test:cli

      - name: Verify npm package
        run: npm run verify:package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/toolbox/browser
          if-no-files-found: error
